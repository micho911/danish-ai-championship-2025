    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;    

sendfile        on;

  # In your nginx.conf or site configuration file
server {
    listen 8080;
    server_name app-micho-dm.cloud.aau.dk;

    # Increase client body size for large base64 images
    client_max_body_size 100M;

    # Increase buffer sizes
    client_body_buffer_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Increase timeouts for large requests
    client_body_timeout 60s;
    client_header_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;   

 # Configure temp directories with proper permissions
    client_body_temp_path /tmp/nginx_client_temp 1 2;
    proxy_temp_path /tmp/nginx_proxy_temp 1 2;

    location /predict {
        proxy_pass http://micho:9051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase proxy buffer sizes
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Handle large request bodies
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://micho:9051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}